async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");
}

    return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#7a6c52" font-weight="700" font-family="'LXGW WenKai','STKaiti','KaiTi',serif">${d[0]} ${d[1]}</text>`;}).join("");
  const poly=pt(dims.map(d=>d[1]));
  return `<svg viewBox="0 0 ${size+20} ${size}" xmlns="http://www.w3.org/2000/svg" style="max-width:${size}px;width:100%">
    ${rings.map(r=>`<polygon points="${r}" fill="none" stroke="#e2d6b8" stroke-width="1"/>`).join("")}
    ${axis}${labels}
    <polygon points="${poly}" fill="rgba(79,122,106,.24)" stroke="#4f7a6a" stroke-width="2"/>
    ${dims.map((d,i)=>{const a=-Math.PI/2+i*Math.PI/2;
      return `<circle cx="${(cx+R*d[1]/max*Math.cos(a)).toFixed(1)}" cy="${(cy+R*d[1]/max*Math.sin(a)).toFixed(1)}" r="3.6" fill="#4f7a6a"/>`;}).join("")}
  </svg>`;
}

/* ================= 卡密验证（Supabase · SECURITY DEFINER 原子扣次） ================= */
/* consume_password(p_hash) 返回值：-1=密令不存在  -2=次数已用完  >=0=本次扣次后剩余次数 */
async function consumeHash(h){
  const sb = getSB();
  if(!sb) throw new Error("系统配置未完成");
  const {data, error} = await sb.rpc("consume_password", { p_hash: h });
  if(error) throw error;
  const r = Number(data);
  if(r === -1) return {ok:false, msg:"密令不正确，请检查后重试"};
  if(r === -2) return {ok:false, msg:"这张密令的 7 次机会已经用完了"};
  if(r < 0 || isNaN(r)) return {ok:false, msg:"密令验证失败，请稍后重试"};
  return {ok:true, remain: r};
}

      <div class="pwd-row">
        <input class="pwd" id="pwdInput" maxlength="14" placeholder="如 WU-A1B2-C3D4" autocomplete="off">
        <button class="btn teal small" id="gateBtn" onclick="startWithPwd()">验 证</button>
      </div>
      <div class="gate-err" id="gateErr">${errMsg?esc(errMsg):""}</div>
    </div>
    <div class="gate-note">

async function startWithPwd(){
  const btn=document.getElementById("gateBtn"), err=document.getElementById("gateErr");
  const raw=document.getElementById("pwdInput").value;
  if(!normCode(raw)){ err.textContent="请输入密令后再验证"; return; }
  if(!getSB()){ err.textContent="系统维护中，请稍后重试"; return; }
  btn.disabled=true; btn.innerHTML='<span class="spin"></span>验证中';
  try{
    const h = await sha256Hex(normCode(raw));
    const r = await consumeHash(h);
    if(!r.ok){ err.textContent=r.msg; btn.disabled=false; btn.textContent="验 证"; return; }
    state.hash=h; state.remain=r.remain; state.answers=[]; state.idx=0; state.done=false; persist();
    startQuiz();
  }catch(e){
    err.textContent="网络开小差了，请检查网络后重试";
    btn.disabled=false; btn.textContent="验 证";
  }
}

function startQuiz(){
  state.done=false; persist();
  renderQ();
}
function renderQ(){
  const q=QUESTIONS[state.idx];
  const sel=state.answers[state.idx];
  app.innerHTML=`
  <div class="card">
    <div style="position:absolute;top:14px;right:16px">${sprigSVG()}</div>
    <div class="quiz-top">
      <button class="q-back" onclick="goBack()" ${state.idx===0?"disabled":""}>⟨ 上一题</button>
      <span class="q-remain">本密令剩余 ${state.remain} 次</span>
    </div>
    <div class="progress"><i style="width:${(state.idx)/QUESTIONS.length*100}%"></i></div>
    <div class="qnum">${swordSVG()} 第 ${String(state.idx+1).padStart(2,"0")} 式 · 共 ${QUESTIONS.length} 式</div>
    <div class="qtext">${esc(q.q)}</div>
    ${q.o.map((o,i)=>`<button class="opt ${sel===o[1]?"sel":""}" onclick="pick('${o[1]}')"><span class="k">${LETTERS[i]}</span>${esc(o[0])}</button>`).join("")}
    <div class="illu-foot">${footMtnSVG()}</div>
  </div>`;
}
function pick(d){
  state.answers[state.idx]=d;
  state.idx++;
  persist();
  if(state.idx<QUESTIONS.length) renderQ();
  else showResult(false);
}
function goBack(){
  if(state.idx>0){ state.idx--; persist(); renderQ(); }
}

/* ================= 结果 ================= */
function computeScore(answers){
  const s={F:0,N:0,L:0,Z:0};
  answers.forEach(d=>{ if(s[d]!==undefined) s[d]++; });
  return s;
}
function sectFor(score){
  const high=Object.keys(score).filter(k=>score[k]>=7).sort().join("");
  return SECTS[high]||SECTS[""];
}

function showResult(){
  state.done=true; persist();
  const score=computeScore(state.answers);
  const sect=sectFor(score);
  app.innerHTML=resultHTML(score,sect,false);
  window.scrollTo(0,0);
}
function showShareResult(payload){
  const score={F:payload.f|0,N:payload.n|0,L:payload.l|0,Z:payload.z|0};
  const sect=sectFor(score);
  app.innerHTML=resultHTML(score,sect,true);
  document.getElementById("footnote").innerHTML="好友分享的测评结果 · <span style='color:#b4232a;cursor:pointer' onclick=\"location.href=location.origin+location.pathname\">点这里我也要测 →</span>";
  window.scrollTo(0,0);
}
async function retest(){
  if(!state.hash){ showGate(); return; }
  toast('<span class="spin"></span>正在点验密令…', 5000);
  try{
    const r=await consumeHash(state.hash);
    if(!r.ok){ state.hash=null; persist(); showGate(r.msg+"，请输入新密令"); return; }
    state.remain=r.remain; state.answers=[]; state.idx=0; state.done=false; persist();
    startQuiz();
  }catch(e){ toast("网络开小差了，请稍后再试"); }
}

/* ================= 分享链接 ================= */
function buildShareURL(){
  const score=computeScore(state.answers);
  const payload={f:score.F,n:score.N,l:score.L,z:score.Z};
  const b64=btoa(unescape(encodeURIComponent(JSON.stringify(payload)))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  return location.origin+location.pathname+"#r="+b64;
}
function parseShare(){
  const m=location.hash.match(/^#r=([A-Za-z0-9_-]+)$/);
  if(!m) return null;
  try{
    let b64=m[1].replace(/-/g,"+").replace(/_/g,"/");
    while(b64.length%4) b64+="=";
    return JSON.parse(decodeURIComponent(escape(atob(b64))));
  }catch(e){ return null; }
}
async function copyLink(){
  const url=buildShareURL();
  let ok=false;
  try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){
    try{
      const ta=document.createElement("textarea");ta.value=url;ta.style.position="fixed";ta.style.opacity="0";
      document.body.appendChild(ta);ta.select();ok=document.execCommand("copy");document.body.removeChild(ta);
    }catch(e2){ok=false;}
  }
  toast(ok?"链接已复制，去粘贴给好友吧～":"复制失败，请手动复制地址栏链接");
}

async function savePoster(){

  const poster=document.getElementById("poster");
  poster.innerHTML=posterHTML(score,sect);
  try{
    const canvas=await html2canvas(poster,{scale:2,backgroundColor:"#f6f1e3",useCORS:true});
    const url=canvas.toDataURL("image/png");
    const img=document.getElementById("pmImg"); img.src=url;
    const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    document.getElementById("pmTip").innerHTML=isMobile
      ? "👇 长按下方图片，保存到手机相册"
      : "👇 已为你下载图片，也可右键另存";
    document.getElementById("posterMask").classList.add("show");
    if(!isMobile){
      const a=document.createElement("a");
      a.href=url; a.download="吵架门派测试结果.png"; a.click();
    }
  }catch(e){
    toast("生成失败，请重试一次");
  } finally {
    poster.innerHTML="";
  }
}

/* ================= 好评有礼 ================= */
function openPraise(){ document.getElementById("praiseMask").classList.add("show"); }
function closePraise(){ document.getElementById("praiseMask").classList.remove("show"); }
document.getElementById("praiseMask").addEventListener("click",e=>{ if(e.target.id==="praiseMask") closePraise(); });

/* ================= 启动路由 ================= */
(function boot(){
  document.getElementById("bannerMtn").innerHTML = bannerMtnSVG();
  const shared=parseShare();
  if(shared){
    showShareResult(shared);
    return;
  }
  if(state.hash && state.done){
    showResult();
    return;
  }
  if(state.hash && state.idx>0 && state.idx<QUESTIONS.length && state.answers.length>0){
    startQuiz();
    return;
  }
  if(state.hash && state.idx===0){
    startQuiz();
    return;
  }
  showGate();
})();
